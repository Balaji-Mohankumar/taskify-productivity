openapi: 3.1.0
info:
  title: Taskify API
  version: 1.0.0
  description: REST contracts for project and task operations and internal notification event delivery.
servers:
  - url: http://localhost
paths:
  /api/projects:
    get:
      summary: List projects
      responses:
        '200':
          description: Projects available to the demo team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get a project
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List tasks for a project
      responses:
        '200':
          description: Tasks grouped by their status by clients.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a task
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Task created in ToDo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      summary: Change a task's status or assignee
      description: Requires the current task revision. A stale revision returns 412; clients reload before retrying.
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - name: If-Match
          in: header
          required: true
          description: ETag previously returned for this task.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Updated task and its new revision.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The task revision is stale; reload the current task.
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Add a comment
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
      responses:
        '201':
          description: Comment created with server-assigned author and timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /internal/notifications:
    post:
      summary: Publish a committed change to the notification service
      description: Internal service-to-service endpoint. Never expose its service key to a browser.
      parameters:
        - name: X-Taskify-Service-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardChanged'
      responses:
        '202':
          description: Event accepted for transient SignalR broadcast.
        '401':
          description: Missing or invalid service credential.
        '422':
          $ref: '#/components/responses/ValidationProblem'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Taskify-Participant-Id
      in: header
      required: true
      description: Selected demo profile for attribution only; this is not authentication.
      schema:
        type: string
        format: uuid
  schemas:
    Project:
      type: object
      required: [id, name, createdAt, isSample]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        isSample: { type: boolean }
    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    Task:
      type: object
      required: [id, projectId, title, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        assigneeId: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [ToDo, InProgress, InReview, Done]
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 4000 }
        assigneeId: { type: [string, 'null'], format: uuid }
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [ToDo, InProgress, InReview, Done]
        assigneeId: { type: [string, 'null'], format: uuid }
    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    Comment:
      type: object
      required: [id, taskId, authorId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    BoardChanged:
      type: object
      required: [eventId, projectId, changeType, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        taskId: { type: [string, 'null'], format: uuid }
        changeType:
          type: string
          enum: [ProjectCreated, TaskCreated, TaskUpdated, CommentAdded]
        actorId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    BadRequest:
      description: Request could not be parsed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationProblem:
      description: Input or entity reference failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Referenced project or task does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }